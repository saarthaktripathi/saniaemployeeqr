name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sania_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only throwaway values. Real secrets live in the hosting provider's secret store.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/sania_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/sania_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/sania_e2e
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/sania_shadow
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (lockfile)
        run: npm ci

      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate migrations apply cleanly
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -c "CREATE DATABASE sania_shadow"
          npx prisma migrate deploy
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - name: Unit + integration tests with coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            coverage/
            playwright-report/
          retention-days: 14
